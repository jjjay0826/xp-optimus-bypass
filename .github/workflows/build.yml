name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to receive the installer (v0.9.2); empty = build only'
        required: false
        default: ''
      source_ref:
        description: 'Source branch or commit to build; the release tag is NOT used as the source'
        required: true
        default: main
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64 zip
      - name: Version
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          src=$(sed -n 's/^#define XPOB_VERSION "\(.*\)"/\1/p' src/xp_optimus_bypass.cpp)
          test -n "$src"
          if [ -n "$TAG" ] && [ "$TAG" != "v$src" ]; then
            echo "::error::Release tag $TAG does not match DLL source version $src"; exit 1
          fi
          echo "version=$src" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build DLL
        run: sh build.sh
      - name: Package installer
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: sh package.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: XP_Optimus_Bypass_v${{ steps.ver.outputs.version }}
          path: XP_Optimus_Bypass_v${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            XP_Optimus_Bypass_v${{ steps.ver.outputs.version }}.zip
            dist/xp_optimus_bypass.dll

  windows-check:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XP_Optimus_Bypass_v${{ needs.build.outputs.version }}
      - name: Validate PowerShell and language switching
        shell: powershell
        run: |
          Expand-Archive -Path (Get-ChildItem *.zip).FullName -DestinationPath checked
          Get-ChildItem checked -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          Add-Type -AssemblyName System.Windows.Forms
          $app = Join-Path $PWD 'checked\XP_Optimus_Bypass\app'
          . (Join-Path $app 'i18n.ps1')
          $installLabel = [string][char]0x5B89 + [char]0x88DD
          if ((T $installLabel) -ne 'Install') { throw 'English default failed' }
          $script:Language = 'zh-TW'
          if ((T $installLabel) -cne $installLabel) { throw 'Traditional Chinese translation failed' }
          $map = Get-Content (Join-Path $app 'i18n.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $map) { throw 'Missing language map' }
          # Loading an arbitrary Vulkan layer in the CI process is not a GPU/X-Plane integration test.
          . (Join-Path $app 'core.ps1')
          $testRoot = Join-Path $env:TEMP ('XPBypass path test ' + [char]0x6E2C + [char]0x8A66 + ' ' + [guid]::NewGuid().ToString('N'))
          try {
            $destination = Resolve-InstallDestination $testRoot $app
            Set-InstallPaths $destination
            if ($script:AppDir -ne (Join-Path $destination 'app')) { throw 'Application path did not follow destination' }
            if ($script:RootLog -ne (Join-Path $destination 'xp_optimus_bypass.log')) { throw 'Log path did not follow destination' }
            [IO.Directory]::CreateDirectory($destination) | Out-Null
            Assert-OwnedRoot
            Set-Content -LiteralPath (Join-Path $destination 'unrelated.txt') -Value 'Do not overwrite'
            $refused = $false
            try { Assert-OwnedRoot } catch { $refused = $true }
            if (-not $refused) { throw 'Unrelated nonempty folder was accepted' }
            foreach ($bad in @($env:USERPROFILE, (Join-Path (Split-Path -Parent $app) 'nested'))) {
              $refused = $false
              try { [void](Resolve-InstallDestination $bad $app) } catch { $refused = $true }
              if (-not $refused) { throw ('Unsafe destination was accepted: ' + $bad) }
            }
          } finally {
            if (Test-Path -LiteralPath $testRoot) { Remove-Item -LiteralPath $testRoot -Recurse -Force }
          }
          Write-Host 'Windows syntax, language and destination boundary checks passed; manual X-Plane/installer tests remain required.'

  publish:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build, windows-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XP_Optimus_Bypass_v${{ needs.build.outputs.version }}
      - name: Attach installer to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
        run: |
          ZIP="XP_Optimus_Bypass_v${VERSION}.zip"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" "$ZIP" --clobber -R "$GITHUB_REPOSITORY"
          gh release view "$TAG" --json body -q .body -R "$GITHUB_REPOSITORY" > old-notes.md
          export ZIP
          python3 - <<'PY'
          import os, hashlib, re, pathlib
          z = os.environ['ZIP']
          digest = hashlib.sha256(pathlib.Path(z).read_bytes()).hexdigest()
          run = os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          block = '\n<!-- ci-installer-begin -->\n'
          block += '### GUI installer update / 圖形安裝介面更新\n\n'
          block += '- English default / 繁體中文選擇；single entry / 單一入口；reinstall support / 可重新安裝。\n'
          block += '- Direct root logging with per-message flush and a live viewer / 直接寫第一層 log、逐筆刷新與即時檢視。\n'
          block += '- This installer includes rebuilt logging code. DLL version is 0.9.2; this release includes the logging update. / 本包重新編譯 log 修正，DLL 版本為 0.9.2，校驗碼重新產生。\n'
          block += '- Installer source is recorded in the build run linked below. / 安裝來源以本次建置紀錄為準，會列出對應的原始碼 commit。\n'
          block += f'- Asset: `{z}`\n- SHA-256: `{digest}`\n- [Build and source commit / 建置與原始碼 commit]({run})\n'
          block += f'- Verify / 驗證: `gh attestation verify {z} -R '+os.environ['GITHUB_REPOSITORY']+'`\n'
          block += '- DLL checksum / DLL 校驗碼：see `app/xp_optimus_bypass.dll` in the packaged `SHA256SUMS.txt`.\n'
          block += '<!-- ci-installer-end -->\n'
          old = pathlib.Path('old-notes.md').read_text()
          old = re.sub(r'\n?<!-- ci-installer-begin -->.*?<!-- ci-installer-end -->\n?', '\n', old, flags=re.S)
          pathlib.Path('notes.md').write_text(old.rstrip()+'\n'+block)
          PY
          gh release edit "$TAG" --notes-file notes.md -R "$GITHUB_REPOSITORY"
