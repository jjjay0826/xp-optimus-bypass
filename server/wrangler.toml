name = "xpob-reports"
main = "worker.js"
compatibility_date = "2025-10-01"

# Create the database first:  npx wrangler d1 create xpob-reports   (then paste its database_id below)
[[d1_databases]]
binding = "DB"
database_name = "xpob-reports"
database_id = "PASTE-DATABASE-ID-HERE"

# Built-in rate limiting: 10 reports per minute per client. The key is kept in memory by Cloudflare only.
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Do not enable Workers Logs / observability: they would record request metadata such as IP addresses.
[observability]
enabled = false
