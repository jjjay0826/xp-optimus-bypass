; XP Optimus Bypass settings. Restart X-Plane after changing anything.
;
; mode  = auto  : use the layer when X-Plane renders on an NVIDIA GPU and an Intel GPU exists (default)
;         on    : always use the bypass (for testing)
;         off   : layer does nothing, only logs FPS (for comparison)
; path  = auto  : bypass while the window is on a screen driven by the Intel GPU, native NVIDIA output
;                 otherwise (default)
;         bypass   : always the bypass          native : always the native NVIDIA output through the layer
;         cpu-copy : bypass with a CPU copy instead of shared memory (for testing)
; probe = 1     : with path=auto, measure native vs bypass once per setup and keep the faster one
;                 (result in xpob_path_cache.txt; needs the DXGI Intel output) (default)
;         0     : do not measure, use the bypass whenever the window is on the Intel screen
; intel_output = auto   : show the picture through DXGI flip mode (D3D12) on the Intel GPU, else Vulkan (default)
;                dxgi   : DXGI only        vulkan : Intel Vulkan swapchain (as in 0.9.2)
;                With the Vulkan output, the bypass cannot come back after native output on the same window
;                (Windows would keep showing a frozen picture), so the probe is then skipped.
; vsync = 0     : no frame cap, may tear (default)
;         1     : sync to the screen refresh, no tearing, FPS capped at the refresh rate
; stats = 1     : write FPS, frame-time percentiles and timings to xp_optimus_bypass.log every 300 frames
;
; measure_driver = 1 : log how long X-Plane's thread spends in the Vulkan driver per frame, by kind of call
;                      ([drv] lines; diagnostics, costs a little CPU) - default 0
;
; Test switches (leave at 0 for normal use):
; test_force_blit=1        convert and scale with blits even when formats and sizes match
; test_force_cpu_copy=1    do not use VK_EXT_external_memory_host
; test_no_extra_queue=1    pretend there is no spare graphics queue (uses a transfer-only queue)
; test_fail_intel_after=N  simulate an Intel failure after N bypass frames (checks the automatic switch)
; test_bypass_after_native=1  allow switching back to the bypass after native output (picture may freeze)
; test_bypass_after_native=2  the same, with a fresh Intel surface (checks whether that keeps the picture)
mode=auto
path=auto
probe=1
vsync=0
stats=1
intel_output=auto
measure_driver=1
test_force_blit=0
test_force_cpu_copy=0
test_no_extra_queue=0
test_fail_intel_after=0
test_bypass_after_native=0
