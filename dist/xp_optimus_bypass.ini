; XP Optimus Bypass settings. Restart X-Plane after changing anything.
;
; mode  = auto  : turn on only when X-Plane renders on an NVIDIA GPU and its window is on a screen driven by an Intel GPU (default)
;         on    : always try (for testing)
;         off   : do nothing at all
; vsync = 0     : no frame cap, may tear (default)
;         1     : sync to the screen refresh, no tearing, FPS capped at the refresh rate
; stats = 1     : write FPS and timings to xp_optimus_bypass.log every 300 frames
mode=auto
vsync=0
stats=1
